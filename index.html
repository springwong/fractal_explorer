<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fractal Explorer</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            position: fixed;
            top: 0;
            left: 0;
        }
        canvas {
            width: 100% !important;
            height: 100dvh !important;
            display: block !important;
            touch-action: none;
        }
        /* Shown by the app when it cannot start (e.g. no WebGPU) */
        #fatal-error {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            box-sizing: border-box;
            background: #000;
            color: #e8e8e8;
            font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        }
        #fatal-error[hidden] { display: none; }
        #fatal-error div { max-width: 34em; }
        #fatal-error h1 { font-size: 20px; margin: 0 0 8px; }
        #fatal-error p { margin: 0; color: #b0b0b0; }
    </style>
    <link data-trunk rel="rust" data-wasm-opt="z" />
</head>
<body>
<div id="fatal-error" role="alert" hidden>
    <div>
        <h1>Fractal Explorer can't start</h1>
        <p class="message"></p>
    </div>
</div>
<script>
// Workaround: wgpu 22 sends maxInterStageShaderComponents which was
// removed from the WebGPU spec (Chrome 130+). Strip it before the call.
if (typeof GPUAdapter !== "undefined") {
    const orig = GPUAdapter.prototype.requestDevice;
    GPUAdapter.prototype.requestDevice = function(desc) {
        if (desc && desc.requiredLimits) {
            delete desc.requiredLimits.maxInterStageShaderComponents;
        }
        return orig.call(this, desc);
    };
}

// Canvas sizing is handled by the Rust per-frame check which reads
// canvas.clientWidth/Height and syncs the pixel buffer + wgpu surface.
</script>
</body>
</html>
